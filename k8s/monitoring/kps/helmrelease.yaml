apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kps
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  ref:
    tag: "91.4.0" # {"$imagepolicy": "flux-system:kube-prometheus-stack:tag"}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kps
  namespace: monitoring
spec:
  interval: 30m
  timeout: 30m
  chartRef:
    kind: OCIRepository
    name: kps
    namespace: flux-system
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    grafana:
      env:
        HTTP_PROXY: "http://127.0.0.1:1080"
        HTTPS_PROXY: "http://127.0.0.1:1080"
        NO_PROXY: "localhost,127.0.0.1,monitoring-loki.monitoring,monitoring-loki.monitoring.svc,monitoring-loki.monitoring.svc.cluster.local,monitoring-kps-kube-promet-prometheus.monitoring,monitoring-kps-kube-promet-prometheus.monitoring.svc,monitoring-kps-kube-promet-prometheus.monitoring.svc.cluster.local,monitoring-kps-kube-promet-alertmanager.monitoring,monitoring-kps-kube-promet-alertmanager.monitoring.svc,monitoring-kps-kube-promet-alertmanager.monitoring.svc.cluster.local"
      grafana.ini:
        plugins:
          preinstall_auto_update: false
      admin:
        existingSecret: "grafana-secrets"
        userKey: admin-user
        passwordKey: admin-password
      envFromSecret: grafana-secrets
      extraSecretMounts:
        - name: sing-box-config
          secretName: sing-box-tun-config
          mountPath: /etc/sing-box
          readOnly: true
      extraContainers: |
        - name: sing-box
          image: ghcr.io/sagernet/sing-box:latest
          args:
            - run
            - -c
            - /etc/sing-box/config.json
          volumeMounts:
            - name: sing-box-config
              mountPath: /etc/sing-box
              readOnly: true
      sidecar:
        datasources:
          enabled: true
          defaultDatasourceEnabled: true
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://monitoring-loki.monitoring:3100
          jsonData:
            maxLines: 1000
      resources:
        requests:
          cpu: 20m
          memory: 256Mi
        limits:
          cpu: 200m
          memory: 1Gi
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        resources:
          requests:
            cpu: 60m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
